name: Atualizar e publicar
on:
  schedule: [{ cron: "0 */4 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["feed-asia/docs/**", "feed-asia/scripts/**", ".github/workflows/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    working-directory: feed-asia
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar arquivos
        run: ls -R docs scripts
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
               git add docs/photos.json
          git diff --cached --quiet || {
            git commit -m "Atualiza fotos"
            git pull --rebase -X theirs
            git push
          }
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: touch docs/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: feed-asia/docs }
      - id: dep
        uses: actions/deploy-pages@v4
